<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="860" height="330" viewBox="0 0 860 330" font-family="Georgia,'Times New Roman',serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#1f2a44" stroke-opacity="0.05"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1f2a44"/>
    </marker>
    <path id="a1" d="M190 165 C 270 165, 280 85, 350 85"/>
    <path id="a2" d="M190 165 L 350 165"/>
    <path id="a3" d="M190 165 C 270 165, 280 245, 350 245"/>
    <path id="b1" d="M530 85 C 600 85, 610 165, 680 165"/>
    <path id="b2" d="M530 165 L 680 165"/>
    <path id="b3" d="M530 245 C 600 245, 610 165, 680 165"/>
  </defs>

  <rect width="860" height="330" fill="#fbf8f1"/>
  <rect width="860" height="330" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="859" height="329" fill="none" stroke="#1f2a44" stroke-opacity="0.25"/>

  <!-- objective, top right -->
  <text x="836" y="28" text-anchor="end" fill="#1f2a44" font-size="15" font-style="italic">
    x* = arg max<tspan font-size="11" dy="5">x</tspan><tspan dy="-5"> 𝔼[ value(x) | evidence ]</tspan>
  </text>

  <!-- edges draw themselves, then hold -->
  <g fill="none" stroke="#1f2a44" stroke-width="1.4" marker-end="url(#arrow)">
    <path d="M190 165 C 270 165, 280 85, 350 85" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.05;0.25;1" dur="8s" repeatCount="indefinite"/></path>
    <path d="M190 165 L 350 165" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.08;0.28;1" dur="8s" repeatCount="indefinite"/></path>
    <path d="M190 165 C 270 165, 280 245, 350 245" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.11;0.31;1" dur="8s" repeatCount="indefinite"/></path>
    <path d="M530 85 C 600 85, 610 165, 680 165" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.33;0.5;1" dur="8s" repeatCount="indefinite"/></path>
    <path d="M530 165 L 680 165" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.36;0.53;1" dur="8s" repeatCount="indefinite"/></path>
    <path d="M530 245 C 600 245, 610 165, 680 165" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.39;0.56;1" dur="8s" repeatCount="indefinite"/></path>
  </g>

  <!-- signal moving through the finished graph -->
  <g fill="#8c1515" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.62;1" dur="8s" repeatCount="indefinite"/>
    <circle r="4"><animateMotion dur="2s" repeatCount="indefinite"><mpath xlink:href="#a1" href="#a1"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2s" begin="0.6s" repeatCount="indefinite"><mpath xlink:href="#a2" href="#a2"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2s" begin="1.2s" repeatCount="indefinite"><mpath xlink:href="#a3" href="#a3"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2s" begin="1s" repeatCount="indefinite"><mpath xlink:href="#b1" href="#b1"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2s" begin="1.6s" repeatCount="indefinite"><mpath xlink:href="#b2" href="#b2"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2s" begin="2.2s" repeatCount="indefinite"><mpath xlink:href="#b3" href="#b3"/></animateMotion></circle>
  </g>

  <!-- nodes -->
  <g fill="#fffdf8" stroke="#1f2a44" stroke-width="1.4">
    <ellipse cx="120" cy="165" rx="70" ry="42"/>
    <rect x="350" y="62" width="180" height="46"/>
    <rect x="350" y="142" width="180" height="46"/>
    <rect x="350" y="222" width="180" height="46"/>
    <rect x="680" y="135" width="150" height="60" stroke-width="2.2"/>
    <rect x="684" y="139" width="142" height="52" fill="none" stroke-width="0.7"/>
  </g>

  <g fill="#1f2a44" text-anchor="middle">
    <text x="120" y="162" font-size="18" font-variant="small-caps">problem</text>
    <text x="120" y="182" font-size="12" font-style="italic" fill="#5a6378">observed in the field</text>

    <text x="440" y="84" font-size="16">Machine Learning</text>
    <text x="440" y="100" font-size="11" font-style="italic" fill="#5a6378">LLM agents, models</text>
    <text x="440" y="164" font-size="16">Data Engineering</text>
    <text x="440" y="180" font-size="11" font-style="italic" fill="#5a6378">collection, cleaning, evaluation</text>
    <text x="440" y="244" font-size="16">Systems</text>
    <text x="440" y="260" font-size="11" font-style="italic" fill="#5a6378">full stack, deployment</text>

    <text x="755" y="162" font-size="18" font-variant="small-caps">product</text>
    <text x="755" y="181" font-size="12" font-style="italic" fill="#5a6378">measured in use</text>
  </g>

  <!-- step labels -->
  <g fill="#8c1515" font-size="12" font-style="italic" text-anchor="middle">
    <text x="270" y="54">(i) formulate</text>
    <text x="440" y="54">(ii) build</text>
    <text x="605" y="54">(iii) validate</text>
  </g>

  <text x="430" y="310" text-anchor="middle" fill="#1f2a44" font-size="13">
    <tspan font-weight="700">Figure 1.</tspan><tspan font-style="italic"> From an observed problem to a product validated by evidence.</tspan>
  </text>
</svg>
